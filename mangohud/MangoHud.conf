# Layout
no_display=1
table_columns=4

# Main metrics
fps
frametime

cpu_stats
cpu_temp
cpu_mhz

gpu_stats
gpu_temp
gpu_core_clock
# gpu_mem_clock
gpu_name

# Integrated GPU is GPU1, dedicated is GPU2
# Set pci_dev to pin a specific GPU
# pci_dev=0:02:00.0

ram
vram

# Position and look
position=top-left
font_size=26
background_color=000000
background_alpha=0.8
alpha=1
round_corners=10

# Custom colors (sRGB hex)
text_color=EEEEEE
cpu_color=2E97CB
gpu_color=2E9762
vram_color=AD64C1
ram_color=C26693

# Color by load
gpu_load_change
gpu_load_value=50,80
gpu_load_color=39F900,FDFD09,B22222

cpu_load_change
cpu_load_value=50,80
cpu_load_color=39F900,FDFD09,B22222

# Labels
cpu_text=CPU
gpu_text=GPU

# Clock as <00:00>, without the "time" label
time=1
time_format=<%H:%M>
time_no_label=1

# Keys
toggle_hud=HOME
